<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi - Fahry Nazri Diwangga</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e63946;
            --primary-white: #ffffff;
            --primary-blue: #1d3557;
            --accent-blue: #457b9d;
            --light-bg: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--accent-blue) 40%, var(--primary-red) 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: rgba(29, 53, 87, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary-red);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-red);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--primary-white);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-red);
        }

        /* Container & Glassmorphism */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 2rem;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }

        .hero-text p.tagline {
            font-size: 1.2rem;
            color: var(--primary-red);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .avatar-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary-red), var(--primary-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
            border: 4px solid var(--primary-white);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* Section Headings */
        .section-title {
            font-size: 1.8rem;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, var(--primary-red), var(--primary-blue));
            border-radius: 2px;
        }

        /* Grid Info & Galeri */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 1.2rem;
            border-radius: 12px;
            border-left: 4px solid var(--primary-blue);
        }

        .info-item i {
            font-size: 1.5rem;
            color: var(--primary-red);
            margin-top: 3px;
        }

        .info-item h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-item p {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 600;
            word-break: break-word;
        }

        /* Galeri Keterampilan & Hobi */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .gallery-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .gallery-img-box {
            height: 180px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-red));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.5rem;
            position: relative;
        }

        .gallery-content {
            padding: 1.5rem;
        }

        .gallery-content h3 {
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        .gallery-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary-red);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 1rem;
        }

        /* Footer */
        footer {
            background: var(--primary-blue);
            color: var(--primary-white);
            text-align: center;
            padding: 1.
